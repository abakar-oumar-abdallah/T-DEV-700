version: '3.9'

services:
  backend:
    image: abakar98/jenkins-api
    pull_policy: always
    container_name: backend  
    env_file:
      - .env  # Charge les variables Supabase
    environment:
      - NODE_ENV=production
      - PORT=3001
    ports:
      - "3001:3001"
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    image: abakar98/jenkins-frontend
    pull_policy: always
    container_name: frontend
    ports:
      - "80:80"
    depends_on:
      - backend  # Attend que le backend soit démarré
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge